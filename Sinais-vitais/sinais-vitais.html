<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAE-Web - Sinais Vitais</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>SAE-Web</h1>
    <nav>
      <ul>
        <li><a href="/Dashboard/dashboad.html">Início</a></li>
        <li><a href="/Cadastro-paciente/novo-paciente.html">Novo Paciente</a></li>
        <li><a href="/Avaliação-enfermagem/avaliação.html">Avaliação</a></li>
      <!--   <li><a href="sinais-vitais.html" class="active">Sinais Vitais</a></li>-->
        <li><a href="/Plano-cuidados/plano-cuidados.html">Plano de Cuidados</a></li>
      </ul>
    </nav>
  </header>

  <main class="form-container">
    <h2>Registro de Sinais Vitais</h2>
    <form class="patient-form">
      <label for="temperatura">Temperatura (°C)</label>
      <input type="number" step="0.1" id="temperatura" name="temperatura" placeholder="Ex: 36.5" required>

      <label for="pressao">Pressão arterial (mmHg)</label>
      <input type="text" id="pressao" name="pressao" placeholder="Ex: 120/80" required>

      <label for="frequencia_cardiaca">Frequência cardíaca (bpm)</label>
      <input type="number" id="frequencia_cardiaca" name="frequencia_cardiaca" placeholder="Ex: 72" required>

      <label for="frequencia_respiratoria">Frequência respiratória (irpm)</label>
      <input type="number" id="frequencia_respiratoria" name="frequencia_respiratoria" placeholder="Ex: 18" required>

      <label for="saturacao">Saturação O₂ (%)</label>
      <input type="number" id="saturacao" name="saturacao" placeholder="Ex: 98" required>

      <label for="observacoes">Observações</label>
      <textarea id="observacoes" name="observacoes" rows="3" placeholder="Observações relevantes"></textarea>

      <button type="submit">Salvar Sinais Vitais</button>
    </form>
  </main>

  <footer class="footer-text">
    © 2026 Unidade Hospitalar
  </footer>
</body>
</html>
