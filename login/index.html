<body>

          </form>

    </div>

<script>

  const usuario1 = document.getElementById('usuario').value;
  const senha1 = document.getElementById('senha').value;

const usuarioCorreto = 'luis123';
const senhaCorreta = '1234';



if(usuario1=== usuarioCorreto && senha1 === senhaCorreta){
  window.location.href = "../Dashboard/dashboad.html";

 window.location.href = "erro.html";

</script>
