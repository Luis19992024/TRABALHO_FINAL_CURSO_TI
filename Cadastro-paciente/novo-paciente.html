<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAE-Web - Novo Paciente</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>SAE-Web</h1>
    <nav>
      <ul>
        <li><a href="/Dashboard/dashboad.html">Início</a></li>
       <!-- <li><a href="novo-paciente.html" class="active">Novo Paciente</a></li> -->
        <li><a href="/Avaliação-enfermagem/avaliação.html">Avaliação</a></li>
        <li><a href="/Plano-cuidados/plano-cuidados.html">Plano de Cuidados</a></li>
      </ul>
    </nav>
  </header>

  <main class="form-container">
    <h2>Cadastro de Paciente</h2>
    <form class="patient-form">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" placeholder="Digite o nome" required>

      <label for="idade">Idade</label>
      <input type="number" id="idade" name="idade" placeholder="Digite a idade" required>

      <label for="sexo_biologico">Sexo biológico</label>
      <select id="sexo_biologico" name="sexo_biologico" required>
        <option value="">Selecione...</option>
        <option value="masculino">Masculino</option>
        <option value="feminino">Feminino</option>
        <option value="intersexo">Intersexo</option>
      </select>

      <label for="genero">Identidade de gênero</label>
      <select id="genero" name="genero">
        <option value="">Selecione...</option>
        <option value="masculino">Masculino</option>
        <option value="feminino">Feminino</option>
        <option value="transgenero">Transgênero</option>
        <option value="nao_binario">Não-binário</option>
        <option value="outro">Outro</option>
        <option value="prefiro_nao_informar">Prefiro não informar</option>
      </select>

      <label for="estado_civil">Estado civil</label>
      <select id="estado_civil" name="estado_civil">
        <option value="">Selecione...</option>
        <option value="solteiro">Solteiro(a)</option>
        <option value="casado">Casado(a)</option>
        <option value="divorciado">Divorciado(a)</option>
        <option value="viuvo">Viúvo(a)</option>
      </select>

      <label for="endereco">Endereço</label>
      <input type="text" id="endereco" name="endereco" placeholder="Digite o endereço">

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX">

      <button type="submit">Salvar Paciente</button>
    </form>
  </main>

  <footer class="footer-text">
    © 2026 Unidade Hospitalar
  </footer>
</body>
</html>
