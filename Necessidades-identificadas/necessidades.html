  <main class="form-container">
    <h2>Necessidades Identificadas</h2>
    <form class="patient-form">
      <label for="necessidade_fisiologica">Necessidades fisiológicas</label>
      <textarea id="necessidade_fisiologica" name="necessidade_fisiologica" rows="3" placeholder="Ex.: alimentação, hidratação, eliminação, sono..."></textarea>

      <label for="necessidade_psicologica">Necessidades psicológicas</label>
      <textarea id="necessidade_psicologica" name="necessidade_psicologica" rows="3" placeholder="Ex.: ansiedade, depressão, apoio emocional..."></textarea>

      <label for="necessidade_social">Necessidades sociais</label>
      <textarea id="necessidade_social" name="necessidade_social" rows="3" placeholder="Ex.: apoio familiar, integração social..."></textarea>

      <label for="necessidade_espiritual">Necessidades espirituais</label>
      <textarea id="necessidade_espiritual" name="necessidade_espiritual" rows="3" placeholder="Ex.: crenças, valores, práticas religiosas..."></textarea>

      <button type="submit">Salvar Necessidades</button>
    </form>
  </main>

  <footer class="footer-text">
