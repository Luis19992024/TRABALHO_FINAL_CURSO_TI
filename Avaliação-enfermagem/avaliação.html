<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAE-Web - Avaliação de Enfermagem</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>SAE-Web</h1>
    <nav>
      <ul>
        <li><a href="/Dashboard/dashboad.html">Início</a></li>
        <li><a href="/Cadastro-paciente/novo-paciente.html">Novo Paciente</a></li>
         <li><a href="avaliacao.html" class="active">Avaliação</a></li>
        <li><a href="/Plano-cuidados/plano-cuidados.html">Plano de Cuidados</a></li>
      </ul>
    </nav>
  </header>

  <main class="form-container">
    <h2>Avaliação de Enfermagem</h2>
    <form class="patient-form">
      <label for="queixa">Queixa principal</label>
      <textarea id="queixa" name="queixa" rows="3" placeholder="Descreva a queixa principal do paciente"></textarea>

      <label for="historico">Histórico de saúde</label>
      <textarea id="historico" name="historico" rows="4" placeholder="Informe antecedentes, doenças prévias, tratamentos..."></textarea>

      <label for="exame_fisico">Exame físico</label>
      <textarea id="exame_fisico" name="exame_fisico" rows="4" placeholder="Descreva achados do exame físico"></textarea>

      <label for="observacoes">Observações adicionais</label>
      <textarea id="observacoes" name="observacoes" rows="3" placeholder="Observações relevantes"></textarea>

      <button type="submit">Salvar Avaliação</button>
    </form>
  </main>

  <footer class="footer-text">
    © 2026 Unidade Hospitalar
  </footer>
</body>
</html>
